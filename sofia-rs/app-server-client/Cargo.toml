[package]
name = "sofia-app-server-client"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "sofia_app_server_client"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
sofia-app-server = { workspace = true }
sofia-app-server-protocol = { workspace = true }
sofia-arg0 = { workspace = true }
sofia-config = { workspace = true }
sofia-core = { workspace = true }
sofia-exec-server = { workspace = true }
sofia-feedback = { workspace = true }
sofia-protocol = { workspace = true }
sofia-uds = { workspace = true }
sofia-utils-absolute-path = { workspace = true }
sofia-utils-rustls-provider = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "rt"] }
tokio-tungstenite = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
