[package]
edition.workspace = true
license.workspace = true
name = "sofia-memories-write"
version.workspace = true

[lib]
name = "sofia_memories_write"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
sofia-backend-client = { workspace = true }
sofia-core = { workspace = true }
sofia-config = { workspace = true }
sofia-features = { workspace = true }
sofia-git-utils = { workspace = true }
sofia-login = { workspace = true }
sofia-model-provider = { workspace = true }
sofia-otel = { workspace = true }
sofia-protocol = { workspace = true }
sofia-rollout = { workspace = true }
sofia-rollout-trace = { workspace = true }
sofia-secrets = { workspace = true }
sofia-state = { workspace = true }
sofia-terminal-detection = { workspace = true }
sofia-utils-absolute-path = { workspace = true }
sofia-utils-output-truncation = { workspace = true }
sofia-utils-template = { workspace = true }
futures = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["fs", "rt", "sync", "time"] }
tracing = { workspace = true, features = ["log"] }
uuid = { workspace = true, features = ["v4", "v5"] }

[dev-dependencies]
sofia-model-provider-info = { workspace = true }
sofia-models-manager = { workspace = true }
core_test_support = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["fs", "macros"] }
wiremock = { workspace = true }
