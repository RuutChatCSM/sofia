[package]
edition.workspace = true
license.workspace = true
name = "sofia-skills-extension"
version.workspace = true

[lib]
name = "sofia_skills_extension"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
sofia-analytics = { workspace = true }
sofia-config = { workspace = true }
sofia-exec-server = { workspace = true }
sofia-extension-api = { workspace = true }
sofia-mcp = { workspace = true }
sofia-otel = { workspace = true }
sofia-protocol = { workspace = true }
sofia-skills = { workspace = true }
sofia-tools = { workspace = true }
sofia-utils-absolute-path = { workspace = true }
sofia-utils-path-uri = { workspace = true }
sofia-utils-plugins = { workspace = true }
sofia-utils-string = { workspace = true }
dirs = { workspace = true }
futures = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
tokio = { workspace = true, features = ["sync", "time"] }
toml = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
assert_matches = { workspace = true }
sofia-models-manager = { workspace = true }
sofia-utils-cargo-bin = { workspace = true }
dunce = { workspace = true }
insta = { workspace = true }
opentelemetry_sdk = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
