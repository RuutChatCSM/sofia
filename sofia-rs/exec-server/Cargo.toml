[package]
name = "sofia-exec-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
doctest = false

# Compiled through #[path] in src/client.rs; cargo-shear 1.11.2 does not normalize
# the ../tests path and incorrectly reports this linked unit-test module as unlinked.
[package.metadata.cargo-shear]
ignored-paths = ["tests/unit/client_provisioning_tests.rs"]

[lints]
workspace = true

[dependencies]
arc-swap = { workspace = true }
axum = { workspace = true, features = ["http1", "tokio", "ws"] }
base64 = { workspace = true }
bytes = { workspace = true }
clatter = { workspace = true }
sofia-api = { workspace = true }
sofia-build-info = { workspace = true }
sofia-config = { workspace = true }
sofia-http-client = { workspace = true }
sofia-exec-server-protocol = { workspace = true }
sofia-file-system = { workspace = true }
sofia-network-proxy = { workspace = true }
sofia-otel = { workspace = true }
sofia-protocol = { workspace = true }
sofia-sandboxing = { workspace = true }
sofia-shell-command = { workspace = true }
sofia-utils-absolute-path = { workspace = true }
sofia-utils-home-dir = { workspace = true }
sofia-utils-path-uri = { workspace = true }
sofia-utils-pty = { workspace = true }
sofia-utils-rustls-provider = { workspace = true }
sofia-websocket-client = { workspace = true }
dirs = { workspace = true }
futures = { workspace = true }
http = { workspace = true }
opentelemetry = { workspace = true }
prost = "0.14.3"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true, features = [
    "fs",
    "io-std",
    "io-util",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "sync",
    "time",
] }
tokio-util = { workspace = true, features = ["io", "rt"] }
tokio-tungstenite = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
rustix = { workspace = true, features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Kernel",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[dev-dependencies]
anyhow = { workspace = true }
sofia-exec-server-test-support = { workspace = true }
sofia-test-binary-support = { workspace = true }
ctor = { workspace = true }
http = { workspace = true }
opentelemetry_sdk = { workspace = true }
pretty_assertions = { workspace = true }
rcgen = { workspace = true }
rustls = { workspace = true }
serial_test = { workspace = true }
tempfile = { workspace = true }
test-case = "3.3.1"
tokio = { workspace = true, features = ["test-util"] }
tracing-opentelemetry = { workspace = true }
tracing-subscriber = { workspace = true }
wiremock = { workspace = true }
