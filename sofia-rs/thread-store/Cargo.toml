[package]
edition.workspace = true
license.workspace = true
name = "sofia-thread-store"
version.workspace = true

[lib]
name = "sofia_thread_store"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
chrono = { workspace = true, features = ["serde"] }
sofia-app-server-protocol = { workspace = true }
sofia-extension-items = { workspace = true }
sofia-git-utils = { workspace = true }
sofia-install-context = { workspace = true }
sofia-otel = { workspace = true }
sofia-protocol = { workspace = true }
sofia-rollout = { workspace = true }
sofia-state = { workspace = true }
sofia-utils-absolute-path = { workspace = true }
sofia-utils-path = { workspace = true }
sofia-utils-path-uri = { workspace = true }
futures = { workspace = true }
pulldown-cmark = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
zstd = { workspace = true }

[dev-dependencies]
sofia-utils-absolute-path = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
uuid = { workspace = true }
